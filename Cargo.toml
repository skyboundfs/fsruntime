[package]
name = "fsruntime"
version = "0.1.5"
edition = "2021"
description = "Standalone runtime for MSFS 2020/2024 addon WASM modules and HTML instruments"
license = "MIT"

[[bin]]
name = "fsruntime"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
wasmtime = "50"
wasmtime-wasi = "50"
tao = "0.34"
wry = "0.53"
png = "0.18.1"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.32"
rfd = "0.15"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
